<!doctype html>
<!--
  The GitHub Pages site is no longer where this site lives; it is served from
  Firebase Hosting at iislucas.io, whose domain Firebase Authentication already
  trusts for sign-in. This page keeps the old address working as an entry
  point, and is published by .github/workflows/deploy-pages.yml as both
  index.html and 404.html so that every path lands here, not just the root.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iislucas.io</title>
    <link rel="canonical" href="https://iislucas.io/" />
    <meta name="robots" content="noindex" />
    <!-- Fallback for a browser that will not run the script below. It cannot
         carry the path across, so it lands on the home page rather than 404. -->
    <meta http-equiv="refresh" content="0; url=https://iislucas.io/" />
    <script>
      // Pages serves this file for any unmatched path, so a deep link such as
      // /concepts/inner-gold arrives here. Carry the path, query and fragment
      // over to the new host instead of dropping the visitor on the home page.
      // replace() rather than assign() so Back does not bounce them here again.
      (function () {
        var moved = 'https://iislucas.io';
        location.replace(moved + location.pathname + location.search + location.hash);
      })();
    </script>
  </head>
  <body>
    <p>This site has moved to <a href="https://iislucas.io/">iislucas.io</a>.</p>
  </body>
</html>
