# Publishes a redirect to GitHub Pages. The site itself is built and deployed
# by deploy-hosting.yml to Firebase Hosting, at iislucas.io.
#
# iislucas.github.io cannot be pointed at Firebase Hosting with a custom domain,
# because GitHub controls DNS for github.io, so keeping the old address working
# means serving something from Pages that forwards. That something needs no
# build, no Firebase config and no secrets, which is why this workflow is a
# copy step rather than the build it used to be.
name: Redirect GitHub Pages to the live site

on:
  push:
    branches: [main]
    # Nothing else affects the redirect, so nothing else needs to republish it.
    paths:
      - 'pages-redirect/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages serves 404.html for any unmatched path, so shipping the redirect
      # under that name too is what makes a deep link forward instead of 404.
      # .nojekyll stops Pages running the output through Jekyll.
      - name: Assemble the redirect
        run: |
          mkdir -p dist-redirect
          cp pages-redirect/index.html dist-redirect/index.html
          cp pages-redirect/index.html dist-redirect/404.html
          touch dist-redirect/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-redirect

      - id: deployment
        uses: actions/deploy-pages@v4
