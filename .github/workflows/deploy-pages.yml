# Publishes a redirect to GitHub Pages, by hand.
#
# The site itself is built and deployed from a local checkout with
# `pnpm run deploy:hosting`; nothing here deploys the app. All this workflow
# does is put `pages-redirect/index.html` on iislucas.github.io so the old
# address forwards to iislucas.io.
#
# iislucas.github.io cannot be pointed at Firebase Hosting with a custom domain,
# because GitHub controls DNS for github.io, so keeping the old address working
# means serving something from Pages that forwards. That something needs no
# build, no Firebase config and no secrets.
#
# Run it from the Actions tab when the redirect changes, which is close to
# never. It is deliberately not on `push`: deployments happen when you ask for
# them, not when a commit lands.
name: Publish the GitHub Pages redirect

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages serves 404.html for any unmatched path, so shipping the redirect
      # under that name too is what makes a deep link forward instead of 404.
      # .nojekyll stops Pages running the output through Jekyll.
      - name: Assemble the redirect
        run: |
          mkdir -p dist-redirect
          cp pages-redirect/index.html dist-redirect/index.html
          cp pages-redirect/index.html dist-redirect/404.html
          touch dist-redirect/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-redirect

      - id: deployment
        uses: actions/deploy-pages@v4
