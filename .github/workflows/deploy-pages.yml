# Builds the Angular app and publishes it to GitHub Pages.
#
# Firebase web config is not secret — it ships inside the browser bundle of
# every Firebase app, and access is enforced by firestore.rules — but it is
# still per-project, so it is kept out of the repository and injected here from
# repository *variables* (Settings > Secrets and variables > Actions >
# Variables). See SETUP.md for the list.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a deploy to be run by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Angular 22 requires >=22.22.3.
          node-version: '22.23.2'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Write environment.local.ts from repository variables
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
        run: node scripts/write-env-from-ci.mjs

      - run: pnpm run build

      # GitHub Pages serves static files and cannot rewrite unknown paths to
      # index.html, so a deep link like /concepts/inner-gold would 404 on a
      # cold load. Pages serves 404.html for any unmatched path, so shipping a
      # copy of index.html under that name makes the SPA router pick the URL up.
      - name: Add SPA fallback
        run: cp dist/iislucas-site/browser/index.html dist/iislucas-site/browser/404.html

      # Stops Pages running the output through Jekyll, which would drop files
      # and folders whose names begin with an underscore.
      - name: Disable Jekyll processing
        run: touch dist/iislucas-site/browser/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/iislucas-site/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
