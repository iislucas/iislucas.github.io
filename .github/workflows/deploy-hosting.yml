# Builds the Angular app and deploys it to Firebase Hosting, which is where the
# site actually lives (iislucas.io / iislucas.dev). GitHub Pages now serves only
# a redirect; see deploy-pages.yml.
#
# Hosting the app on a Firebase domain is not just tidiness: Firebase
# Authentication checks a sign-in against the browser's address bar, and the
# custom domains here have to appear in its authorized domains list. See
# SETUP.md, and `pnpm run firebase:setup`, which asserts them.
#
# Firebase web config is not secret — it ships inside the browser bundle of
# every Firebase app, and access is enforced by firestore.rules — but it is
# still per-project, so it is injected from repository *variables*. The deploy
# credential is a real secret and lives under Secrets.
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race; let a newer push supersede an in-flight one.
concurrency:
  group: hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Angular 22 requires >=22.22.3.
          node-version: '22.23.2'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Write environment.local.ts from repository variables
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
        run: node scripts/write-env-from-ci.mjs

      - run: pnpm run build

      # Checked before writing the file so the failure names the missing
      # setting, rather than surfacing as an opaque credentials error later.
      - name: Write the deploy credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing repository secret FIREBASE_SERVICE_ACCOUNT." >&2
            echo "Set it under Settings > Secrets and variables > Actions > Secrets. See SETUP.md." >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      # firebase-tools is already a devDependency, so this needs no extra
      # action and stays pinned by the lockfile like everything else.
      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          pnpm exec firebase deploy \
            --only hosting \
            --project "${{ vars.FIREBASE_PROJECT_ID }}" \
            --non-interactive \
            --message "${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
