<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lucas Dixon — moved to iislucas.io</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      This file exists only for GitHub Pages, which serves the root of `main`
      at https://iislucas.github.io/. The site itself is on Firebase Hosting;
      this page sends visitors and search engines to its canonical home.

      It is not part of the Angular app: that has its own index at
      src/index.html and is built into dist/. Do not confuse the two.

      This is the 404 copy: GitHub Pages serves it for any path it does not
      recognise, which is every deep link into the old address. The script
      below carries that path across, so /concepts/some-idea still arrives at
      the right page on the new domain.
    -->
    <link rel="canonical" href="https://iislucas.io/" />
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="0; url=https://iislucas.io/" />
    <script>
      // Runs before the meta refresh and keeps the path, query and fragment,
      // so /concepts/some-idea lands on the same page at the new address.
      // replace() rather than assign() so Back does not bounce off this page.
      (function () {
        var target = 'https://iislucas.io' + location.pathname + location.search + location.hash;
        location.replace(target);
      })();
    </script>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial,
          sans-serif;
        line-height: 1.7;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        color: #182126;
        background-color: #ffffff;
      }
      main {
        max-width: 32em;
        padding: 0 1.5em;
        text-align: center;
      }
      h1 {
        font-size: 1.35em;
        font-weight: 600;
        line-height: 1.25;
      }
      a {
        color: #1f6f7a;
      }
    </style>
  </head>
  <body>
    <!-- Shown only if both the script and the meta refresh are unavailable. -->
    <main>
      <h1>This site has moved</h1>
      <p>
        Lucas Dixon's site now lives at
        <a href="https://iislucas.io/">iislucas.io</a>.
      </p>
    </main>
  </body>
</html>
