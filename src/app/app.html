<div class="app-container">
  <app-header></app-header>
  <app-edit-mode-banner></app-edit-mode-banner>

  <main>
    @switch (currentView()) {
      @case (Views.Home) {
        <app-home></app-home>
      }
      @case (Views.Concepts) {
        <app-concept-gallery></app-concept-gallery>
      }
      @case (Views.ConceptView) {
        <app-concept-view></app-concept-view>
      }
      @case (Views.Login) {
        <app-login></app-login>
      }
      @default {
        <app-not-found></app-not-found>
      }
    }
  </main>

  <app-footer></app-footer>
</div>
