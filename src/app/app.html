<div class="app-container">
  <app-header></app-header>

  <main>
    @switch (currentView()) {
      @case (Views.Home) {
        <app-home></app-home>
      }
      @case (Views.Concepts) {
        <app-concept-gallery></app-concept-gallery>
      }
      @case (Views.ConceptView) {
        <app-concept-view></app-concept-view>
      }
      @case (Views.Login) {
        <app-login></app-login>
      }
      @default {
        <app-not-found></app-not-found>
      }
    }
  </main>

  <app-footer></app-footer>
</div>

<!-- Outside the app container: it floats over the page rather than taking a
     place in it, the way ilc-members-manager shows its build. -->
<span class="version-badge" [title]="'Build: ' + appVersion">v{{ appVersion }}</span>
