@if (user(); as user) {
  <div class="profile-menu-container">
    <button class="avatar-button" (click)="toggleMenu()" title="Account menu">
      @if (user.photoURL) {
        <img [src]="user.photoURL" alt="" class="avatar-image" referrerpolicy="no-referrer" />
      } @else {
        <div class="avatar-initial" [style.backgroundColor]="avatarColor()">
          {{ userInitial() }}
        </div>
      }
    </button>

    @if (menuOpen()) {
      <div class="menu-overlay" (click)="menuOpen.set(false)"></div>
      <div class="menu-dropdown">
        <div class="user-info">
          <div class="display-name">{{ user.displayName }}</div>
          <div class="email-chip">{{ user.email }}</div>
          @if (isAdmin()) {
            <span class="admin-chip">Admin</span>
          }
        </div>

        @if (isAdmin()) {
          <div class="menu-divider"></div>

          <button class="menu-link menu-button" (click)="toggleEditMode()">
            <app-icon name="edit" width="20px" height="20px"></app-icon>
            {{ editMode.active() ? 'Leave edit mode' : 'Edit this site' }}
          </button>
        }

        <div class="menu-divider"></div>

        <div class="menu-section-label">Appearance</div>
        @for (option of themes.options; track option.id) {
          <button
            class="menu-link menu-button theme-option"
            [class.active]="themes.theme() === option.id"
            [attr.aria-pressed]="themes.theme() === option.id"
            (click)="selectTheme(option.id)"
          >
            <span class="theme-swatch" [attr.data-theme-preview]="option.id"></span>
            <span class="theme-text">
              <span class="theme-label">{{ option.label }}</span>
              <span class="theme-description">{{ option.description }}</span>
            </span>
            @if (themes.theme() === option.id) {
              <app-icon name="check" width="18px" height="18px"></app-icon>
            }
          </button>
        }

        <div class="menu-divider"></div>

        <button class="menu-link menu-button" (click)="logout()">
          <app-icon name="logout" width="20px" height="20px"></app-icon>
          Sign out
        </button>
      </div>
    }
  </div>
}
